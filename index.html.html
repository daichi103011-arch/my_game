const MENU="<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>QOL\u30b2\u30fc\u30e0\u30ba<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --bg1:#fff6e4; --bg2:#ffe8d6; --bg3:#ffd9e8;\n    --ink:#4a3f35; --paper:#ffffff; --shadow:#00000018;\n    --nakama:#7fa88f; --nakama-d:#5c8a71;\n    --quiz:#f0c25b; --quiz-d:#cf9f2e;\n    --sumo:#c2413a; --sumo-d:#962f29;\n    box-sizing:border-box;\n    padding-top:env(safe-area-inset-top,0px);\n    padding-bottom:env(safe-area-inset-bottom,0px);\n  }\n  html,body{height:100%;}\n  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}\n  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}\n  body{\n    margin:0; color:var(--ink); font-family:'Zen Maru Gothic', sans-serif;\n    background:\n      radial-gradient(circle at 15% 10%, #ffffffaa, transparent 40%),\n      radial-gradient(circle at 85% 85%, #ffffff88, transparent 45%),\n      linear-gradient(145deg, var(--bg1), var(--bg2) 55%, var(--bg3));\n    min-height:100%;\n    display:flex; flex-direction:column; align-items:center;\n    padding:36px 18px 44px; gap:30px;\n    touch-action:manipulation; -webkit-user-select:none; user-select:none;\n    overflow-x:hidden; position:relative;\n  }\n\n  /* \u3075\u308f\u3075\u308f\u6d6e\u304b\u3076\u98fe\u308a */\n  .deco{position:absolute; font-size:2.2rem; opacity:.5; pointer-events:none; animation:float 6s ease-in-out infinite;}\n  .deco1{top:8%; left:6%; animation-delay:0s;}\n  .deco2{top:14%; right:8%; animation-delay:1.2s; font-size:1.8rem;}\n  .deco3{bottom:10%; left:10%; animation-delay:2.1s; font-size:1.6rem;}\n  .deco4{bottom:16%; right:7%; animation-delay:.6s; font-size:2rem;}\n  @keyframes float{\n    0%,100%{ transform:translateY(0) rotate(-4deg); }\n    50%{ transform:translateY(-14px) rotate(4deg); }\n  }\n\n  .title-wrap{text-align:center; position:relative; z-index:1;}\n  h1{\n    font-size:2rem; margin:0; color:var(--sumo-d);\n    letter-spacing:.06em; line-height:1.4;\n    text-shadow:2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;\n  }\n  .wobble{display:inline-block; animation:wobble 2.4s ease-in-out infinite;}\n  @keyframes wobble{\n    0%,100%{ transform:rotate(0deg); }\n    25%{ transform:rotate(-8deg); }\n    75%{ transform:rotate(8deg); }\n  }\n  .subtitle{\n    display:inline-block; margin-top:10px; font-size:1rem; color:#5a4632; font-weight:700;\n    background:#ffffffcc; padding:6px 18px; border-radius:20px;\n    box-shadow:0 2px 0 #00000012;\n  }\n\n  .menu{\n    display:flex; flex-direction:column; gap:20px;\n    width:100%; max-width:420px; position:relative; z-index:1;\n  }\n\n  .game-card{\n    display:flex; align-items:center; gap:16px;\n    padding:20px 22px; background:var(--paper);\n    border-radius:26px; text-decoration:none; color:var(--ink);\n    box-shadow:0 7px 0 var(--card-shadow, #ddd), 0 10px 18px var(--shadow);\n    font-weight:900; font-size:1.25rem;\n    border:3px solid var(--card-border, #eee);\n    transition:transform .12s ease, box-shadow .12s ease;\n    position:relative; overflow:hidden;\n    -webkit-tap-highlight-color:transparent;\n  }\n  .game-card:active{\n    transform:translateY(6px);\n    box-shadow:0 1px 0 var(--card-shadow, #ddd), 0 3px 6px var(--shadow);\n  }\n  .card-nakama{ --card-border:var(--nakama); --card-shadow:var(--nakama-d); }\n  .card-quiz{ --card-border:var(--quiz); --card-shadow:var(--quiz-d); }\n  .card-sumo{ --card-border:var(--sumo); --card-shadow:var(--sumo-d); }\n\n  .icon-badge{\n    flex:0 0 auto; width:62px; height:62px; border-radius:50%;\n    display:flex; align-items:center; justify-content:center;\n    font-size:2rem; color:#fff;\n    box-shadow:inset 0 -4px 0 #00000022;\n  }\n  .card-nakama .icon-badge{ background:linear-gradient(160deg, #94c2a9, var(--nakama)); }\n  .card-quiz .icon-badge{ background:linear-gradient(160deg, #f8d685, var(--quiz)); }\n  .card-sumo .icon-badge{ background:linear-gradient(160deg, #e0695f, var(--sumo)); }\n\n  .card-text{display:flex; flex-direction:column; gap:2px; flex:1;}\n  .card-text .label{font-size:1.2rem;}\n  .card-text .hint{font-size:.82rem; font-weight:700; color:#9a8f80;}\n\n  .arrow{font-size:1.6rem; color:var(--card-border, #ccc); flex:0 0 auto;}\n\n  .sparkle{\n    position:absolute; top:-6px; right:10px; font-size:1.1rem;\n    animation:sparkle 1.8s ease-in-out infinite;\n  }\n  .card-quiz .sparkle{animation-delay:.4s;}\n  .card-sumo .sparkle{animation-delay:.9s;}\n  @keyframes sparkle{\n    0%,100%{ opacity:.3; transform:scale(.8) rotate(0deg); }\n    50%{ opacity:1; transform:scale(1.2) rotate(20deg); }\n  }\n\n  .footer-note{\n    margin-top:6px; font-size:.85rem; color:#5a4632; text-align:center;\n    max-width:320px; line-height:1.6; position:relative; z-index:1;\n    background:#ffffffcc; padding:8px 16px; border-radius:16px;\n  }\n\n  @media (prefers-color-scheme: dark){\n    :root:not([data-theme=\"light\"]){\n      --bg1:#2a2318; --bg2:#30241f; --bg3:#2c1f28; --ink:#f3ead8; --paper:#3a3226; --shadow:#00000055;\n    }\n    :root:not([data-theme=\"light\"]) .subtitle,\n    :root:not([data-theme=\"light\"]) .footer-note{\n      color:#f3ead8; background:#00000055;\n    }\n  }\n<\/style>\n<\/head>\n<body>\n\n<span class=\"deco deco1\">\ud83c\udf88<\/span>\n<span class=\"deco deco2\">\u2b50<\/span>\n<span class=\"deco deco3\">\ud83c\udf38<\/span>\n<span class=\"deco deco4\">\ud83c\udf8a<\/span>\n\n<div class=\"title-wrap\">\n  <h1><span class=\"wobble\">\ud83c\udfae<\/span> QOL\u30b2\u30fc\u30e0\u30ba<\/h1>\n  <div class=\"subtitle\">\u3059\u304d\u306a\u30b2\u30fc\u30e0\u3092 \u3048\u3089\u3093\u3067\u306d<\/div>\n<\/div>\n\n<div class=\"menu\">\n  <a href=\"#nakama\" data-game=\"nakama\" class=\"game-card card-nakama\">\n    <div class=\"icon-badge\">\ud83e\udde9<\/div>\n    <div class=\"card-text\">\n      <span class=\"label\">\u306a\u304b\u307e\u3055\u304c\u3057<\/span>\n      <span class=\"hint\">\u540c\u3058\u7d75\u3092\u307f\u3064\u3051\u3088\u3046<\/span>\n    <\/div>\n    <span class=\"arrow\">\u25b6<\/span>\n    <span class=\"sparkle\">\u2728<\/span>\n  <\/a>\n\n  <a href=\"#quiz\" data-game=\"quiz\" class=\"game-card card-quiz\">\n    <div class=\"icon-badge\">\ud83c\udfa4<\/div>\n    <div class=\"card-text\">\n      <span class=\"label\">\u601d\u3044\u51fa\u30af\u30a4\u30ba<\/span>\n      <span class=\"hint\">\u306a\u3064\u304b\u3057\u3044\u554f\u984c\u306b\u6311\u6226<\/span>\n    <\/div>\n    <span class=\"arrow\">\u25b6<\/span>\n    <span class=\"sparkle\">\u2728<\/span>\n  <\/a>\n\n  <a href=\"#sumo\" data-game=\"sumo\" class=\"game-card card-sumo\">\n    <div class=\"icon-badge\">\ud83e\udd3c<\/div>\n    <div class=\"card-text\">\n      <span class=\"label\">\u30df\u30cb\u76f8\u64b2<\/span>\n      <span class=\"hint\">\u9023\u6253\u3067\u62bc\u3057\u51fa\u305b\uff01<\/span>\n    <\/div>\n    <span class=\"arrow\">\u25b6<\/span>\n    <span class=\"sparkle\">\u2728<\/span>\n  <\/a>\n<\/div>\n\n<div class=\"footer-note\">\u30bf\u30c3\u30d7\u3059\u308b\u3068\u3001\u305d\u308c\u305e\u308c\u306e\u30b2\u30fc\u30e0\u304c\u958b\u304d\u307e\u3059<\/div>\n\n<\/body>\n<\/html>\n\n<\/body><\/html>";
const G={nakama:"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>\u306a\u304b\u307e\u3055\u304c\u3057<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap\" rel=\"stylesheet\">\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js\"><\/script>\n<style>\n  :root{\n    --bg:#faf3e6;\n    --card-back:#e8967a;\n    --card-back-2:#f0ac93;\n    --card-face:#fffdf8;\n    --ink:#4a3f35;\n    --accent:#7fa88f;\n    --accent-2:#7fa8c9;\n    --matched:#8fbf8f;\n    --shadow:#00000022;\n    --card-size:100px;\n    box-sizing:border-box;\n    padding-top:env(safe-area-inset-top,0px);\n    padding-bottom:env(safe-area-inset-bottom,0px);\n  }\n  html,body{height:100%;}\n  html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; text-size-adjust:100%;}\n  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}\n  body{\n    margin:0; background:var(--bg); color:var(--ink);\n    font-family:'Zen Maru Gothic', sans-serif;\n    padding:18px 14px 24px;\n    display:flex; align-items:center; justify-content:center;\n    touch-action:manipulation; -webkit-user-select:none; user-select:none;\n  }\n  button{-webkit-appearance:none; appearance:none;}\n  .layout{\n    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;\n    gap:24px; width:100%; max-width:1000px;\n  }\n  .side{\n    flex:0 0 220px; display:flex; flex-direction:column; gap:12px; align-items:center;\n    text-align:center;\n  }\n  h1{\n    font-size:1.6rem; font-weight:900; margin:0; letter-spacing:.04em; color:var(--ink);\n  }\n  .sub{font-size:.9rem; color:#8a7f70;}\n\n  .levels{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}\n  .levels button{\n    font-family:inherit; font-size:.95rem; font-weight:700; padding:10px 18px;\n    border-radius:30px; border:none; background:#fff; color:var(--ink);\n    box-shadow:0 3px 0 var(--shadow); cursor:pointer;\n  }\n  .levels button.active{background:var(--accent); color:#fff;}\n\n  .status{font-size:1.05rem; font-weight:700; min-height:1.6em; text-align:center; color:var(--ink);}\n\n  .grid-wrap{flex:1 1 auto; display:flex; justify-content:center; align-items:center;}\n  .grid{\n    display:grid; gap:10px; justify-content:center;\n  }\n  .card{\n    width:var(--card-size); height:var(--card-size); border-radius:16px; cursor:pointer;\n    display:flex; align-items:center; justify-content:center;\n    background:linear-gradient(160deg, var(--card-back), var(--card-back-2));\n    box-shadow:0 4px 0 var(--shadow);\n    font-size:2.4rem; transition:transform .25s, background .25s;\n    user-select:none; position:relative;\n  }\n  .card .mark{color:#fff; font-size:2rem; font-weight:900;}\n  .card.flipped, .card.matched{\n    background:var(--card-face);\n    box-shadow:0 2px 0 var(--shadow);\n  }\n  .card.matched{background:var(--matched); }\n  .card.wrong{animation:shake .4s;}\n  @keyframes shake{\n    0%,100%{transform:translateX(0);}\n    25%{transform:translateX(-6px);}\n    75%{transform:translateX(6px);}\n  }\n\n  .controls{display:flex; gap:12px;}\n  .controls button{\n    font-family:inherit; font-size:.95rem; font-weight:700; padding:11px 22px;\n    border-radius:30px; border:none; background:var(--accent-2); color:#fff;\n    box-shadow:0 3px 0 var(--shadow); cursor:pointer;\n  }\n\n  .overlay{\n    position:fixed; top:0; right:0; bottom:0; left:0; background:#faf3e6ee; display:none;\n    align-items:center; justify-content:center; flex-direction:column; gap:18px; z-index:5;\n    text-align:center; padding:20px;\n  }\n  .overlay.show{display:flex;}\n  .overlay h2{font-size:1.9rem; color:var(--accent); font-weight:900;}\n  .overlay p{font-size:1.1rem; color:var(--ink);}\n\n  @media (orientation:landscape) and (max-height:520px){\n    :root{--card-size:64px;}\n    body{padding:10px 14px;}\n    .layout{gap:16px;}\n    .side{flex-basis:180px; gap:8px;}\n    h1{font-size:1.2rem;}\n    .sub{display:none;}\n    .levels button{padding:7px 12px; font-size:.8rem;}\n    .status{font-size:.85rem; min-height:1.2em;}\n    .card .mark{font-size:1.4rem;}\n    .grid{gap:7px;}\n    .controls button{padding:8px 16px; font-size:.8rem;}\n  }\n\n  @media (max-width:480px) and (orientation:portrait){\n    :root{--card-size:78px;}\n  }\n\n  @media (prefers-color-scheme: dark){\n    :root:not([data-theme=\"light\"]){\n      --bg:#2a251e; --ink:#f3ead8; --card-face:#3a332a;\n    }\n  }\n<\/style>\n<\/head>\n<body data-theme=\"light\">\n\n<div class=\"layout\">\n  <div class=\"side\">\n    <h1>\u306a\u304b\u307e\u3055\u304c\u3057<\/h1>\n    <div class=\"sub\">\u540c\u3058\u7d75\u306e\u30ab\u30fc\u30c9\u30922\u307e\u3044\u3081\u304f\u308a\u307e\u3057\u3087\u3046<\/div>\n    <div class=\"levels\">\n      <button data-n=\"3\" class=\"active\">\u304b\u3093\u305f\u3093(3\u7d44)<\/button>\n      <button data-n=\"4\">\u3075\u3064\u3046(4\u7d44)<\/button>\n      <button data-n=\"6\">\u3080\u305a\u304b\u3057\u3044(6\u7d44)<\/button>\n    <\/div>\n    <div class=\"status\" id=\"status\">\u30ab\u30fc\u30c9\u3092\u30bf\u30c3\u30d7\u3057\u3066\u3081\u304f\u3063\u3066\u304f\u3060\u3055\u3044<\/div>\n    <div class=\"controls\">\n      <button id=\"resetBtn\">\u3082\u3046\u4e00\u5ea6\u3042\u305d\u3076<\/button>\n      <button id=\"musicBtn\">\ud83c\udfb5 \u97f3\u697d OFF<\/button>\n    <\/div>\n  <\/div>\n  <div class=\"grid-wrap\">\n    <div class=\"grid\" id=\"grid\"><\/div>\n  <\/div>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\">\n  <h2>\u305c\u3093\u3076 \u305d\u308d\u3044\u307e\u3057\u305f\uff01<\/h2>\n  <p id=\"overlayMsg\">\u3059\u3070\u3089\u3057\u3044\u3067\u3059\uff01<\/p>\n  <button onclick=\"startGame(currentN)\" style=\"font-family:inherit;font-size:1.1rem;font-weight:700;padding:14px 30px;border-radius:30px;border:none;background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--shadow);cursor:pointer;\">\u3064\u3065\u3051\u308b<\/button>\n<\/div>\n\n<script>\nconst EMOJI_POOL=['\ud83c\udf4e','\ud83c\udf4a','\ud83c\udf47','\ud83c\udf53','\ud83c\udf4c','\ud83c\udf38','\ud83d\udc36','\ud83d\udc31','\ud83d\udc26','\ud83c\udf3b','\u2b50','\ud83c\udf51','\ud83c\udf49','\ud83d\udc1f','\ud83c\udf61','\u2615'];\nconst grid=document.getElementById('grid');\nconst statusEl=document.getElementById('status');\nconst overlay=document.getElementById('overlay');\nlet currentN=3;\nlet cards=[];\nlet flipped=[];\nlet matchedCount=0;\nlet busy=false;\n\ndocument.querySelectorAll('.levels button').forEach(btn=>{\n  btn.addEventListener('click',()=>{\n    document.querySelectorAll('.levels button').forEach(b=>b.classList.remove('active'));\n    btn.classList.add('active');\n    startGame(parseInt(btn.dataset.n,10));\n  });\n});\ndocument.getElementById('resetBtn').addEventListener('click',()=>startGame(currentN));\n\n/* ---- \u30c1\u30ebBGM(\u751f\u6210\u97f3\u697d) ---- */\nconst musicBtn=document.getElementById('musicBtn');\nlet musicOn=false, musicReady=false;\nlet padSynth,pluckSynth,chordLoop,melodyLoop;\n\nfunction setupMusic(){\n  if(musicReady) return;\n  musicReady=true;\n  const reverb=new Tone.Reverb({decay:6, wet:0.45}).toDestination();\n  const filter=new Tone.Filter(1200,'lowpass').connect(reverb);\n\n  padSynth=new Tone.PolySynth(Tone.Synth,{\n    oscillator:{type:'sine'},\n    envelope:{attack:1.8, decay:1, sustain:0.6, release:3}\n  }).connect(filter);\n  padSynth.volume.value=-20;\n\n  pluckSynth=new Tone.Synth({\n    oscillator:{type:'triangle'},\n    envelope:{attack:0.02, decay:0.8, sustain:0, release:1.2}\n  }).connect(reverb);\n  pluckSynth.volume.value=-16;\n\n  const chords=[\n    ['C4','E4','G4','B4'],\n    ['A3','C4','E4','G4'],\n    ['F3','A3','C4','E4'],\n    ['G3','B3','D4','F4']\n  ];\n  let chordIndex=0;\n  chordLoop=new Tone.Loop(time=>{\n    padSynth.triggerAttackRelease(chords[chordIndex % chords.length], '4n*7', time);\n    chordIndex++;\n  }, '2m').start(0);\n\n  const pentatonic=['C4','D4','E4','G4','A4','C5','D5','E5'];\n  melodyLoop=new Tone.Loop(time=>{\n    if(Math.random()<0.55){\n      const note=pentatonic[Math.floor(Math.random()*pentatonic.length)];\n      pluckSynth.triggerAttackRelease(note,'8n',time);\n    }\n  }, '2n').start('4n');\n\n  Tone.Transport.bpm.value=64;\n}\n\nmusicBtn.addEventListener('click', async ()=>{\n  await Tone.start();\n  setupMusic();\n  if(!musicOn){\n    Tone.Transport.start();\n    musicOn=true;\n    musicBtn.textContent='\ud83c\udfb5 \u97f3\u697d ON';\n  } else {\n    Tone.Transport.pause();\n    musicOn=false;\n    musicBtn.textContent='\ud83c\udfb5 \u97f3\u697d OFF';\n  }\n});\n\nfunction shuffle(arr){\n  for(let i=arr.length-1;i>0;i--){\n    const j=Math.floor(Math.random()*(i+1));\n    [arr[i],arr[j]]=[arr[j],arr[i]];\n  }\n  return arr;\n}\n\nfunction colsFor(n){\n  const total=n*2;\n  if(total<=6) return 3;\n  if(total<=8) return 4;\n  return 4;\n}\n\nfunction startGame(n){\n  currentN=n;\n  overlay.classList.remove('show');\n  const chosen=shuffle([...EMOJI_POOL]).slice(0,n);\n  const deck=shuffle([...chosen,...chosen]);\n  cards=deck.map((emo,i)=>({id:i,num:i+1,emo,flipped:false,matched:false}));\n  flipped=[]; matchedCount=0; busy=false;\n  grid.style.gridTemplateColumns='repeat('+colsFor(n)+', var(--card-size))';\n  grid.innerHTML='';\n  cards.forEach(c=>{\n    const div=document.createElement('div');\n    div.className='card';\n    div.innerHTML='<span class=\"mark\">'+c.num+'<\/span>';\n    div.addEventListener('click',()=>onCardClick(c,div));\n    c.el=div;\n    grid.appendChild(div);\n  });\n  statusEl.textContent='\u30ab\u30fc\u30c9\u3092\u30bf\u30c3\u30d7\u3057\u3066\u3081\u304f\u3063\u3066\u304f\u3060\u3055\u3044';\n}\n\nfunction onCardClick(c,div){\n  if(busy || c.flipped || c.matched) return;\n  c.flipped=true;\n  div.classList.add('flipped');\n  div.innerHTML=c.emo;\n  flipped.push(c);\n  if(flipped.length===2){\n    busy=true;\n    const [a,b]=flipped;\n    if(a.emo===b.emo){\n      a.matched=b.matched=true;\n      a.el.classList.add('matched'); b.el.classList.add('matched');\n      matchedCount++;\n      statusEl.textContent='\u305b\u3044\u304b\u3044\uff01 \u3088\u304f\u3067\u304d\u307e\u3057\u305f';\n      flipped=[]; busy=false;\n      if(matchedCount===currentN){\n        setTimeout(()=>{\n          overlay.classList.add('show');\n        },500);\n      }\n    } else {\n      statusEl.textContent='\u304a\u3057\u3044\uff01 \u3082\u3046\u3044\u3061\u3069';\n      a.el.classList.add('wrong'); b.el.classList.add('wrong');\n      setTimeout(()=>{\n        a.flipped=b.flipped=false;\n        a.el.classList.remove('flipped','wrong');\n        b.el.classList.remove('flipped','wrong');\n        a.el.innerHTML='<span class=\"mark\">'+a.num+'<\/span>';\n        b.el.innerHTML='<span class=\"mark\">'+b.num+'<\/span>';\n        flipped=[]; busy=false;\n        statusEl.textContent='\u30ab\u30fc\u30c9\u3092\u30bf\u30c3\u30d7\u3057\u3066\u3081\u304f\u3063\u3066\u304f\u3060\u3055\u3044';\n      },1300);\n    }\n  }\n}\n\nstartGame(currentN);\n<\/script>\n<\/body>\n<\/html>\n\n<\/body><\/html>",quiz:"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>\u601d\u3044\u51fa\u30af\u30a4\u30ba<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap\" rel=\"stylesheet\">\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js\"><\/script>\n<style>\n  :root{\n    --bg1:#1b1440; --bg2:#2c1f5c;\n    --gold:#f0c25b; --gold-dim:#8a6f2c;\n    --panel:#241a4d; --panel-2:#2f2266;\n    --ink:#fbf6e8; --ink-dim:#b7aed6;\n    --ok:#5cbf7f; --soft:#7fa8c9;\n    --shadow:#00000055;\n    box-sizing:border-box;\n    padding-top:env(safe-area-inset-top,0px);\n    padding-bottom:env(safe-area-inset-bottom,0px);\n  }\n  html,body{height:100%;}\n  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}\n  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}\n  body{\n    margin:0; color:var(--ink); font-family:'Zen Maru Gothic', sans-serif;\n    background:\n      radial-gradient(circle at 20% -10%, #ffffff22, transparent 40%),\n      radial-gradient(circle at 85% 0%, #ffffff18, transparent 35%),\n      linear-gradient(160deg, var(--bg1), var(--bg2));\n    display:flex; flex-direction:column; align-items:center;\n    padding:20px 14px 30px; gap:16px;\n    touch-action:manipulation; -webkit-user-select:none; user-select:none;\n  }\n  button{-webkit-appearance:none; appearance:none;}\n  .marquee{\n    font-size:1.5rem; font-weight:900; letter-spacing:.08em; color:var(--gold);\n    text-shadow:0 0 14px #f0c25b66; text-align:center;\n  }\n  .progress-wrap{width:100%; max-width:480px; justify-self:center;}\n  .progress-label{font-size:.85rem; color:var(--ink-dim); text-align:center; margin-bottom:4px;}\n  .progress-bar{height:8px; background:#00000044; border-radius:6px; overflow:hidden;}\n  .progress-fill{height:100%; background:linear-gradient(90deg, var(--gold-dim), var(--gold)); transition:width .3s;}\n\n  .stage{\n    width:100%; max-width:480px; justify-self:center; background:var(--panel);\n    border:2px solid var(--gold-dim); border-radius:20px;\n    box-shadow:0 8px 0 var(--shadow), 0 0 40px #00000055;\n    padding:26px 22px; display:flex; flex-direction:column; gap:16px; align-items:center;\n    position:relative; overflow:hidden; transition:box-shadow .3s;\n  }\n  .stage.flashOk{box-shadow:0 8px 0 var(--shadow), 0 0 0 4px var(--ok);}\n  .stage.flashSoft{box-shadow:0 8px 0 var(--shadow), 0 0 0 4px var(--soft);}\n  .qnum{font-size:.85rem; color:var(--gold); font-weight:700; letter-spacing:.06em;}\n  .question{\n    font-size:1.35rem; font-weight:700; text-align:center; line-height:1.6; min-height:3.2em;\n    display:flex; align-items:center; justify-content:center;\n  }\n  .answerBtn{\n    font-family:inherit; font-size:1.05rem; font-weight:700; padding:13px 28px;\n    border-radius:30px; border:none; background:var(--gold); color:#241a4d;\n    box-shadow:0 3px 0 var(--gold-dim); cursor:pointer;\n  }\n  .answer{\n    font-size:1.2rem; font-weight:700; color:var(--gold); text-align:center;\n    min-height:1.6em; opacity:0; transform:translateY(6px); transition:all .35s;\n  }\n  .answer.show{opacity:1; transform:translateY(0);}\n\n  .judge-row{display:flex; gap:14px;}\n  .judge-row button{\n    font-family:inherit; font-size:1.05rem; font-weight:900; padding:14px 24px;\n    border-radius:16px; border:none; cursor:pointer; color:#fff;\n    box-shadow:0 4px 0 var(--shadow);\n  }\n  .ok-btn{background:linear-gradient(160deg, #6fd18f, var(--ok));}\n  .soft-btn{background:linear-gradient(160deg, #97c2e0, var(--soft));}\n\n  .nav-row{display:flex; gap:14px; width:100%; max-width:480px; justify-self:center; justify-content:space-between;}\n  .nav-row button{\n    font-family:inherit; font-size:.95rem; font-weight:700; padding:11px 18px;\n    border-radius:24px; border:1px solid var(--gold-dim); background:var(--panel-2); color:var(--ink);\n    cursor:pointer;\n  }\n  .nav-row button:disabled{opacity:.35; cursor:default;}\n\n  .musicBtn{\n    font-family:inherit; font-size:.9rem; font-weight:700; padding:10px 18px;\n    border-radius:24px; border:1px solid var(--gold-dim); background:var(--panel-2); color:var(--gold);\n    cursor:pointer;\n  }\n\n  .confetti{\n    position:absolute; top:0; right:0; bottom:0; left:0; pointer-events:none; overflow:hidden;\n  }\n  .confetti span{\n    position:absolute; top:-10%; font-size:1.4rem; animation:fall 1.4s ease-in forwards;\n  }\n  @keyframes fall{\n    to{ transform:translateY(320px) rotate(200deg); opacity:0; }\n  }\n  .layout{\n    display:grid; width:100%; justify-items:center;\n    grid-template-columns:1fr;\n    grid-template-areas:\"marquee\" \"progress\" \"stage\" \"nav\";\n    gap:16px;\n  }\n  .marquee{grid-area:marquee;}\n  .progress-wrap{grid-area:progress;}\n  .stage{grid-area:stage;}\n  .nav-row{grid-area:nav;}\n  @media (orientation:landscape) and (max-height:600px){\n    body{padding:10px 14px; gap:8px;}\n    .layout{\n      grid-template-columns:34% 1fr; grid-template-rows:auto auto 1fr;\n      grid-template-areas:\"marquee stage\" \"progress stage\" \"nav stage\";\n      gap:10px 18px; align-items:start; max-width:none;\n    }\n    .marquee{font-size:1.2rem; justify-self:center;}\n    .progress-wrap{width:100%; max-width:none;}\n    .nav-row{flex-direction:column; gap:8px; width:100%; max-width:none; align-self:start;}\n    .nav-row button{width:100%; padding:9px 12px;}\n    .stage{max-width:none; width:100%; padding:16px 18px; gap:12px;}\n    .question{font-size:1.3rem; min-height:2.6em;}\n  }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"layout\">\n<div class=\"marquee\">\u2728 \u601d\u3044\u51fa\u30af\u30a4\u30ba \u2728<\/div>\n\n<div class=\"progress-wrap\">\n  <div class=\"progress-label\" id=\"progLabel\">\u7b2c 1 \u554f / 50\u554f<\/div>\n  <div class=\"progress-bar\"><div class=\"progress-fill\" id=\"progFill\" style=\"width:2%\"><\/div><\/div>\n<\/div>\n\n<div class=\"stage\" id=\"stage\">\n  <div class=\"confetti\" id=\"confetti\"><\/div>\n  <div class=\"qnum\" id=\"qnum\">Q1<\/div>\n  <div class=\"question\" id=\"question\">\u3088\u307f\u3053\u307f\u3061\u3085\u3046\u2026<\/div>\n  <button class=\"answerBtn\" id=\"revealBtn\">\u3053\u305f\u3048\u3092 \u307f\u308b<\/button>\n  <div class=\"answer\" id=\"answer\"><\/div>\n  <div class=\"judge-row\">\n    <button class=\"ok-btn\" id=\"okBtn\">\ud83c\udf89 \u305b\u3044\u304b\u3044\uff01<\/button>\n    <button class=\"soft-btn\" id=\"softBtn\">\ud83d\ude42 \u304a\u3057\u3044\uff01<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"nav-row\">\n  <button id=\"prevBtn\">\u25c0 \u307e\u3048\u306e\u554f\u984c<\/button>\n  <button class=\"musicBtn\" id=\"musicBtn\">\ud83c\udfb5 \u97f3\u697d OFF<\/button>\n  <button id=\"nextBtn\">\u3064\u304e\u306e\u554f\u984c \u25b6<\/button>\n<\/div>\n<\/div>\n\n<script>\nconst RAW = `\u4e00\u5e74\u306b\u5b63\u7bc0\u306f\u3044\u304f\u3064\u3042\u308b\u3067\u3057\u3087\u3046\uff1f||4\u3064\uff08\u6625\u30fb\u590f\u30fb\u79cb\u30fb\u51ac\uff09\n\u304a\u6b63\u6708\u306b\u98df\u3079\u308b\u3001\u304a\u3081\u3067\u305f\u3044\u6599\u7406\u306f\uff1f||\u304a\u305b\u3061\u6599\u7406\n\u6843\u592a\u90ce\u306f\u4f55\u304b\u3089\u751f\u307e\u308c\u305f\uff1f||\u6843\uff08\u3082\u3082\uff09\n\u3046\u3055\u304e\u306e\u8033\u306f\u9577\u3044\uff1f\u77ed\u3044\uff1f||\u9577\u3044\n1\u305f\u30591\u306f\uff1f||2\n\u4fe1\u53f7\u3067\u300c\u6b62\u307e\u308c\u300d\u3092\u8868\u3059\u8272\u306f\uff1f||\u8d64\n\u72ac\u306e\u9cf4\u304d\u58f0\u306f\uff1f||\u30ef\u30f3\u30ef\u30f3\n\u732b\u306e\u9cf4\u304d\u58f0\u306f\uff1f||\u30cb\u30e3\u30fc\u30cb\u30e3\u30fc\n\u65e5\u672c\u3067\u4e00\u756a\u9ad8\u3044\u5c71\u306f\uff1f||\u5bcc\u58eb\u5c71\n\u4e03\u5915\u306f\u4f55\u6708\u4f55\u65e5\uff1f||7\u67087\u65e5\n\u304a\u306b\u304e\u308a\u306e\u5b9a\u756a\u306e\u5177\u3068\u3044\u3048\u3070\uff1f||\u6885\u5e72\u3057\u3084\u9bad\u306a\u3069\n\u6843\u592a\u90ce\u306e\u304a\u4f9b\u306f\u72ac\u30fb\u733f\u3068\u3082\u3046\u4e00\u5339\u306f\uff1f||\u304d\u3058\n\u4e00\u9031\u9593\u306f\u4f55\u65e5\uff1f||7\u65e5\n\u6d66\u5cf6\u592a\u90ce\u304c\u52a9\u3051\u305f\u751f\u304d\u7269\u306f\uff1f||\u4e80\uff08\u304b\u3081\uff09\n\u96ea\u304c\u964d\u308b\u306e\u306f\u3069\u306e\u5b63\u7bc0\uff1f||\u51ac\n\u671d\u9854\u304c\u54b2\u304f\u306e\u306f\u3069\u306e\u5b63\u7bc0\uff1f||\u590f\n\u304a\u6708\u898b\u3067\u98df\u3079\u308b\u3082\u306e\u306f\uff1f||\u304a\u6708\u898b\u3060\u3093\u3054\n\u7bc0\u5206\u306b\u6295\u3052\u308b\u3082\u306e\u306f\uff1f||\u8c46\n\u3053\u3069\u3082\u306e\u65e5\u306b\u3042\u3052\u308b\u3082\u306e\u306f\uff1f||\u3053\u3044\u306e\u307c\u308a\n\u308a\u3093\u3054\u306f\u4f55\u8272\u304c\u591a\u3044\uff1f||\u8d64\uff08\u3084\u7dd1\uff09\n\u30d0\u30ca\u30ca\u306f\u4f55\u8272\uff1f||\u9ec4\u8272\n\u305e\u3046\u306e\u9f3b\u306f\u9577\u3044\uff1f\u77ed\u3044\uff1f||\u9577\u3044\n\u300c\u3046\u3055\u304e\u3068\u304b\u3081\u300d\u3067\u52dd\u3063\u305f\u306e\u306f\u3069\u3061\u3089\uff1f||\u304b\u3081\n\u304a\u3070\u3042\u3055\u3093\u304c\u6843\u3092\u62fe\u3063\u305f\u306e\u306f\u5ddd\uff1f\u5c71\uff1f||\u5ddd\n1\u5e74\u306f\u4f55\u304b\u6708\uff1f||12\u304b\u6708\n\u306b\u308f\u3068\u308a\u306e\u9cf4\u304d\u58f0\u306f\uff1f||\u30b3\u30b1\u30b3\u30c3\u30b3\u30fc\n\u725b\u306e\u9cf4\u304d\u58f0\u306f\uff1f||\u30e2\u30fc\u30e2\u30fc\n\u9854\u306b\u3042\u308b\u3001\u3082\u306e\u3092\u898b\u308b\u5834\u6240\u306f\uff1f||\u76ee\n\u624b\u306b\u306f\u6307\u304c\u4f55\u672c\u3042\u308b\uff1f||5\u672c\n\u3059\u3044\u304b\u306e\u5b63\u7bc0\u306f\uff1f||\u590f\n\u307f\u304b\u3093\u306e\u5b63\u7bc0\u306f\uff1f||\u51ac\n\u304a\u7c73\u304c\u4f5c\u3089\u308c\u308b\u5834\u6240\u306f\uff1f||\u7530\u3093\u307c\n\u304a\u98a8\u5442\u306b\u5165\u308b\u306e\u306f\u4f53\u3092\u4f55\u3059\u308b\u305f\u3081\uff1f||\u4f53\u3092\u6d17\u3046\u30fb\u6e29\u3081\u308b\n\u82b1\u54b2\u304b\u3058\u3044\u3055\u3093\u304c\u7070\u3092\u307e\u3044\u305f\u3089\u54b2\u3044\u305f\u82b1\u306f\uff1f||\u685c\n\u592a\u967d\u304c\u6607\u308b\u306e\u306f\u6771\uff1f\u897f\uff1f||\u6771\n\u592a\u967d\u304c\u6c88\u3080\u306e\u306f\u6771\uff1f\u897f\uff1f||\u897f\n\u4e00\u5e74\u3067\u4e00\u756a\u6691\u3044\u5b63\u7bc0\u306f\uff1f||\u590f\n\u4e00\u5e74\u3067\u4e00\u756a\u5bd2\u3044\u5b63\u7bc0\u306f\uff1f||\u51ac\n\u304a\u3060\u3093\u3054\u306e\u6750\u6599\u306f\u4e3b\u306b\u4f55\u306e\u7c89\uff1f||\u304a\u7c73\uff08\u3082\u3061\u7c73\uff09\u306e\u7c89\n\u306b\u3093\u3058\u3093\u306f\u4f55\u8272\uff1f||\u30aa\u30ec\u30f3\u30b8\u8272\n\u304d\u3085\u3046\u308a\u306f\u4f55\u8272\uff1f||\u7dd1\u8272\n\u3059\u3044\u304b\u306e\u4e2d\u8eab\u306f\u4f55\u8272\uff1f||\u8d64\uff08\u3084\u9ec4\u8272\uff09\n\u5098\u3092\u3055\u3059\u306e\u306f\u3069\u3093\u306a\u5929\u6c17\u306e\u65e5\uff1f||\u96e8\u306e\u65e5\n\u300c\u3082\u3046\u3044\u304f\u3064\u5bdd\u308b\u3068\u304a\u6b63\u6708\u300d\u306e\u6b4c\u3001\u5b63\u7bc0\u306f\u3044\u3064\uff1f||\u51ac\n\u305f\u3093\u307d\u307d\u306e\u82b1\u306f\u4f55\u8272\uff1f||\u9ec4\u8272\n\u3072\u306a\u796d\u308a\u306f\u4f55\u6708\u4f55\u65e5\uff1f||3\u67083\u65e5\n\u304a\u3058\u3044\u3055\u3093\u30fb\u304a\u3070\u3042\u3055\u3093\u3092\u656c\u3046\u65e5\u3068\u3044\u3048\u3070\uff1f||\u656c\u8001\u306e\u65e5\n\u304a\u6b63\u6708\u306b\u9cf4\u3089\u3059\u9418\u306f\u4f55\u56de\uff1f||108\u56de\uff08\u9664\u591c\u306e\u9418\uff09\n\u304a\u306f\u3057\u306f\u4f55\u672c\u3067\u4f7f\u3046\uff1f||2\u672c\n\u4e00\u65e5\u306f\u4f55\u6642\u9593\uff1f||24\u6642\u9593`;\n\nconst QUIZ = RAW.trim().split('\\n').map((line,i)=>{\n  const [q,a]=line.split('||');\n  return {q:q.trim(), a:a.trim(), n:i+1};\n});\nconst TOTAL = QUIZ.length;\n\nlet idx=0;\nconst stage=document.getElementById('stage');\nconst qnumEl=document.getElementById('qnum');\nconst qEl=document.getElementById('question');\nconst aEl=document.getElementById('answer');\nconst revealBtn=document.getElementById('revealBtn');\nconst progLabel=document.getElementById('progLabel');\nconst progFill=document.getElementById('progFill');\nconst prevBtn=document.getElementById('prevBtn');\nconst nextBtn=document.getElementById('nextBtn');\nconst confettiWrap=document.getElementById('confetti');\n\nfunction render(){\n  const item=QUIZ[idx];\n  qnumEl.textContent='Q'+item.n;\n  qEl.textContent=item.q;\n  aEl.textContent=item.a;\n  aEl.classList.remove('show');\n  progLabel.textContent='\u7b2c '+item.n+' \u554f / '+TOTAL+'\u554f';\n  progFill.style.width=Math.round(item.n/TOTAL*100)+'%';\n  prevBtn.disabled = idx===0;\n  nextBtn.disabled = idx===TOTAL-1;\n  stage.classList.remove('flashOk','flashSoft');\n}\nrender();\n\nrevealBtn.addEventListener('click', ()=>{\n  aEl.classList.add('show');\n  playReveal();\n});\nprevBtn.addEventListener('click', ()=>{ if(idx>0){idx--; render();} });\nnextBtn.addEventListener('click', ()=>{ if(idx<TOTAL-1){idx++; render();} });\n\ndocument.getElementById('okBtn').addEventListener('click', ()=>{\n  playCorrect(); burstConfetti(); flash('flashOk');\n});\ndocument.getElementById('softBtn').addEventListener('click', ()=>{\n  playGentle(); flash('flashSoft');\n});\nfunction flash(cls){\n  stage.classList.remove('flashOk','flashSoft');\n  stage.classList.add(cls);\n  setTimeout(()=>stage.classList.remove(cls), 900);\n}\nfunction burstConfetti(){\n  const emojis=['\ud83c\udf89','\u2b50','\ud83c\udf8a','\u2728'];\n  for(let i=0;i<10;i++){\n    const s=document.createElement('span');\n    s.textContent=emojis[Math.floor(Math.random()*emojis.length)];\n    s.style.left=(Math.random()*90)+'%';\n    s.style.animationDelay=(Math.random()*0.3)+'s';\n    confettiWrap.appendChild(s);\n    setTimeout(()=>s.remove(), 1700);\n  }\n}\n\n/* ---- \u97f3\u697d\u30fb\u52b9\u679c\u97f3\uff08Tone.js\u3067\u751f\u6210\u3001\u8457\u4f5c\u6a29\u30d5\u30ea\u30fc\uff09 ---- */\nlet audioReady=false;\nlet bgmSynth, bgmLoop, sfxSynth;\nfunction setupAudio(){\n  if(audioReady) return;\n  audioReady=true;\n  const reverb=new Tone.Reverb({decay:3, wet:0.3}).toDestination();\n  bgmSynth=new Tone.PolySynth(Tone.Synth,{\n    oscillator:{type:'triangle'},\n    envelope:{attack:0.4, decay:0.3, sustain:0.5, release:1.5}\n  }).connect(reverb);\n  bgmSynth.volume.value=-22;\n  sfxSynth=new Tone.Synth({oscillator:{type:'sine'}}).connect(reverb);\n\n  const chords=[['C4','E4','G4'],['F3','A3','C4'],['G3','B3','D4'],['C4','E4','G4']];\n  let ci=0;\n  bgmLoop=new Tone.Loop(time=>{\n    bgmSynth.triggerAttackRelease(chords[ci%chords.length], '2n', time);\n    ci++;\n  }, '1m').start(0);\n  Tone.Transport.bpm.value=96;\n}\nlet musicOn=false;\ndocument.getElementById('musicBtn').addEventListener('click', async ()=>{\n  await Tone.start();\n  setupAudio();\n  if(!musicOn){\n    Tone.Transport.start();\n    musicOn=true;\n    document.getElementById('musicBtn').textContent='\ud83c\udfb5 \u97f3\u697d ON';\n  } else {\n    Tone.Transport.pause();\n    musicOn=false;\n    document.getElementById('musicBtn').textContent='\ud83c\udfb5 \u97f3\u697d OFF';\n  }\n});\n\nasync function ensureAudio(){ await Tone.start(); setupAudio(); }\n\nasync function playReveal(){\n  await ensureAudio();\n  const t=Tone.now();\n  sfxSynth.triggerAttackRelease('A5','16n', t);\n  sfxSynth.triggerAttackRelease('C6','8n', t+0.12);\n}\nasync function playCorrect(){\n  await ensureAudio();\n  const t=Tone.now();\n  ['C5','E5','G5','C6'].forEach((n,i)=>sfxSynth.triggerAttackRelease(n,'8n', t+i*0.12));\n}\nasync function playGentle(){\n  await ensureAudio();\n  const t=Tone.now();\n  sfxSynth.triggerAttackRelease('E4','8n', t);\n  sfxSynth.triggerAttackRelease('C4','4n', t+0.18);\n}\n<\/script>\n<\/body>\n<\/html>\n\n<\/body><\/html>",sumo:"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>\u30df\u30cb\u76f8\u64b2<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap\" rel=\"stylesheet\">\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js\"><\/script>\n<style>\n  :root{\n    --bg:#f6eedb; --ink:#3b2f23; --red:#c2413a; --blue:#3f6fb0; --wood:#8a5a34; --panel:#fffaf0;\n    --sand:#d9b77c; --sand2:#c79f62; --straw:#b58a3c; --shadow:#0000002a;\n    box-sizing:border-box;\n    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);\n  }\n  @media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#2a241b; --ink:#f3ead2; --panel:#3a3226;}}\n  :root[data-theme=\"dark\"]{--bg:#2a241b; --ink:#f3ead2; --panel:#3a3226;}\n  html,body{height:100%;}\n  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}\n  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}\n  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Zen Maru Gothic',sans-serif;\n    display:flex; flex-direction:column; align-items:center; gap:12px; padding:14px 12px 20px; touch-action:manipulation; -webkit-user-select:none; user-select:none;}\n  button{-webkit-appearance:none; appearance:none;}\n  h1{margin:0; font-size:1.6rem; font-weight:900; letter-spacing:.15em; color:var(--red);}\n  .top{width:100%; max-width:420px; display:flex; justify-content:space-between; align-items:center; font-weight:700;}\n  .dots span{font-size:1.3rem; margin:0 2px;}\n  .toggles button{font-family:inherit; font-size:.8rem; font-weight:700; padding:6px 10px; border-radius:16px; border:1px solid var(--wood); background:var(--panel); color:var(--ink); margin-left:4px;}\n  .stage{position:relative; width:100%; max-width:420px; height:250px; border-radius:16px; overflow:hidden;\n    background:linear-gradient(180deg,#fdf3d8 0%,#f6dfae 70%,#e9c98a 100%); border:4px solid var(--wood); box-shadow:0 6px 0 var(--shadow);}\n  .banner{position:absolute; top:0; left:0; right:0; height:22px; background:repeating-linear-gradient(90deg,var(--red) 0 30px,#fff 30px 60px); opacity:.85;}\n  .dohyo{position:absolute; bottom:0; left:14%; right:14%; height:44px; background:linear-gradient(180deg,var(--sand),var(--sand2)); border-top:3px solid var(--straw);}\n  .tawara{position:absolute; bottom:38px; width:16px; height:16px; border-radius:6px; background:var(--straw);}\n  #TW1{left:calc(14% - 8px);} #TW2{right:calc(14% - 8px);}\n  .floor{position:absolute; bottom:0; left:0; right:0; height:14px; background:#a9784a;}\n  .rk{position:absolute; bottom:40px; width:92px; height:101px; transform-origin:50% 100%; transition:left .06s linear, transform .5s ease;}\n  .rk svg{display:block;}\n  .tag{position:absolute; bottom:18px; font-size:.75rem; font-weight:900; color:#fff; padding:1px 8px; border-radius:10px; z-index:3;}\n  #TL{left:10px; background:var(--blue);} #TR{right:10px; background:var(--red);}\n  .msg{position:absolute; top:28px; left:0; right:0; text-align:center; font-size:2rem; font-weight:900; color:var(--red); text-shadow:0 2px 0 #fff, 0 0 8px #fff; min-height:2.4rem; z-index:5;}\n  .surge{position:absolute; top:78px; right:14px; font-weight:900; color:#fff; background:var(--red); padding:3px 10px; border-radius:12px; display:none; z-index:5;}\n  .bump{animation:bump .08s;}\n  @keyframes bump{50%{translate:3px 0;}}\n  .gauge{width:100%; max-width:420px; height:16px; border-radius:10px; background:linear-gradient(90deg,var(--blue),#ddd 50%,var(--red)); position:relative; border:2px solid var(--wood);}\n  .mark{position:absolute; top:-6px; width:8px; height:26px; background:var(--ink); border-radius:4px; left:50%; transform:translateX(-50%);}\n  .push{width:100%; max-width:420px; height:110px; border:none; border-radius:24px; font-family:inherit; font-size:2rem; font-weight:900; color:#fff;\n    background:linear-gradient(160deg,#e0584f,var(--red)); box-shadow:0 8px 0 #8f2b26; cursor:pointer;}\n  .push:active{transform:translateY(5px); box-shadow:0 3px 0 #8f2b26;}\n  .hint{font-size:.85rem; opacity:.75; text-align:center;}\n  .overlay{position:fixed; top:0; right:0; bottom:0; left:0; background:#000a; display:none; align-items:center; justify-content:center; z-index:10; padding:20px;}\n  .overlay.show{display:flex;}\n  .card{background:var(--panel); border:3px solid var(--wood); border-radius:20px; padding:24px 20px; text-align:center; max-width:340px; width:100%; display:flex; flex-direction:column; gap:12px; align-items:center;}\n  .card h2{margin:0; font-size:1.7rem; color:var(--red);}\n  .card p{margin:0; font-size:1rem;}\n  .btn{font-family:inherit; font-size:1.1rem; font-weight:900; padding:12px 26px; border-radius:24px; border:none; background:var(--red); color:#fff; box-shadow:0 4px 0 #8f2b26; cursor:pointer;}\n  .diff{display:flex; gap:8px;}\n  .diff button{font-family:inherit; font-weight:700; font-size:.95rem; padding:8px 14px; border-radius:18px; border:2px solid var(--wood); background:#fff; color:#3b2f23; cursor:pointer;}\n  .diff button.on{background:var(--wood); color:#fff;}\n  .layout{display:flex; flex-direction:column; gap:12px; width:100%; max-width:420px; align-items:center;}\n  .left,.right{width:100%; display:flex; flex-direction:column; gap:12px; align-items:center;}\n  @media (orientation:landscape) and (max-height:600px){\n    body{padding:8px 14px; gap:6px;}\n    h1{font-size:1.15rem;}\n    .top{max-width:none;}\n    .layout{flex-direction:row; max-width:none; gap:16px; align-items:center;}\n    .left{flex:1.6;} .right{flex:1; gap:10px;}\n    .stage{max-width:none; height:min(230px,58vh);}\n    .gauge{max-width:none;}\n    .push{max-width:none; height:min(150px,30vh); font-size:1.8rem;}\n    .hint{font-size:.8rem;}\n  }\n<\/style>\n<\/head>\n<body>\n<h1>\u30df\u30cb\u76f8\u64b2<\/h1>\n<div class=\"top\">\n  <div class=\"dots\" id=\"dots\"><\/div>\n  <div id=\"roundLabel\">1\u756a\u76ee<\/div>\n  <div class=\"toggles\"><button id=\"bgmBtn\">\ud83c\udfb5 ON<\/button><button id=\"sfxBtn\">\ud83d\udd0a ON<\/button><\/div>\n<\/div>\n\n<div class=\"layout\"><div class=\"left\">\n<div class=\"stage\" id=\"stage\">\n  <div class=\"banner\"><\/div>\n  <div class=\"floor\"><\/div>\n  <div class=\"dohyo\"><\/div>\n  <div class=\"tawara\" id=\"TW1\"><\/div><div class=\"tawara\" id=\"TW2\"><\/div>\n  <div class=\"rk\" id=\"P\"><\/div>\n  <div class=\"rk\" id=\"C\"><\/div>\n  <div class=\"tag\" id=\"TL\">\u3042\u306a\u305f<\/div><div class=\"tag\" id=\"TR\">CPU<\/div>\n  <div class=\"msg\" id=\"msg\"><\/div>\n  <div class=\"surge\" id=\"surge\">\ud83d\udca2 \u3050\u3044\u3063\uff01<\/div>\n<\/div>\n<div class=\"gauge\"><div class=\"mark\" id=\"mark\"><\/div><\/div>\n<\/div><div class=\"right\">\n<button class=\"push\" id=\"push\">\u304a\u3059\uff01<\/button>\n<div class=\"hint\">\u30dc\u30bf\u30f3\u3092\u9023\u6253\u3057\u3066\u3001\u76f8\u624b\u3092\u571f\u4ff5\u306e\u5916\u3078\u62bc\u3057\u51fa\u305d\u3046\uff01\uff08\u30b9\u30da\u30fc\u30b9\u30ad\u30fc\u3067\u3082OK\uff09<\/div>\n<\/div><\/div>\n\n<div class=\"overlay show\" id=\"ov\">\n  <div class=\"card\" id=\"card\">\n    <h2>\u30df\u30cb\u76f8\u64b2<\/h2>\n    <p>3\u756a\u52dd\u8ca0\u30fb2\u756a\u5148\u53d6\uff01<br>\u9023\u6253\u3067\u76f8\u624b\u3092\u571f\u4ff5\u306e\u5916\u3078\u62bc\u3057\u51fa\u305b<\/p>\n    <div class=\"diff\" id=\"diff\">\n      <button data-d=\"14\">\u3084\u3055\u3057\u3044<\/button><button data-d=\"20\" class=\"on\">\u3075\u3064\u3046<\/button><button data-d=\"27\">\u3064\u3088\u3044<\/button>\n    <\/div>\n    <button class=\"btn\" id=\"startBtn\">\u306f\u3058\u3081\u308b<\/button>\n  <\/div>\n<\/div>\n\n<script>\nconst $=id=>document.getElementById(id);\nfunction rikishi(color){return '<svg viewBox=\"0 0 100 110\" width=\"92\" height=\"101\">'\n +'<ellipse cx=\"34\" cy=\"100\" rx=\"13\" ry=\"9\" fill=\"#e8b48a\"/><ellipse cx=\"66\" cy=\"100\" rx=\"13\" ry=\"9\" fill=\"#e8b48a\"/>'\n +'<ellipse cx=\"50\" cy=\"70\" rx=\"34\" ry=\"32\" fill=\"#f2c49b\"/>'\n +'<path d=\"M18 78 Q50 96 82 78 L80 92 Q50 108 20 92 Z\" fill=\"'+color+'\"/><rect x=\"44\" y=\"84\" width=\"12\" height=\"20\" rx=\"4\" fill=\"'+color+'\"/>'\n +'<ellipse cx=\"84\" cy=\"58\" rx=\"13\" ry=\"8\" fill=\"#f2c49b\"/><ellipse cx=\"78\" cy=\"72\" rx=\"13\" ry=\"8\" fill=\"#eab88d\"/>'\n +'<circle cx=\"52\" cy=\"30\" r=\"20\" fill=\"#f7d3b0\"/>'\n +'<ellipse cx=\"50\" cy=\"9\" rx=\"10\" ry=\"6\" fill=\"#2b2118\"/><path d=\"M32 28 Q34 10 52 10 Q70 10 72 28 Q64 16 52 16 Q40 16 32 28Z\" fill=\"#2b2118\"/>'\n +'<circle cx=\"55\" cy=\"32\" r=\"2.4\" fill=\"#2b2118\"/><circle cx=\"67\" cy=\"32\" r=\"2.4\" fill=\"#2b2118\"/>'\n +'<circle cx=\"51\" cy=\"40\" r=\"4\" fill=\"#f29a8a\" opacity=\".6\"/><circle cx=\"71\" cy=\"40\" r=\"4\" fill=\"#f29a8a\" opacity=\".6\"/>'\n +'<path d=\"M57 41 Q61 45 65 41\" stroke=\"#2b2118\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"/><\/svg>';}\n$('P').innerHTML=rikishi('#3f6fb0'); $('C').innerHTML=rikishi('#c2413a');\nconst P=$('P'),C=$('C'),msg=$('msg'),mark=$('mark'),surgeEl=$('surge');\nlet state='title', b=0, round=1, wins=[0,0], base=20, surge=0, surgeCd=4, outSide=0, edge=0;\nlet bgmOn=true, sfxOn=true;\nconst A={ready:false};\n\n/* ---------- \u97f3 ---------- */\nfunction initAudio(){\n  if(A.ready||!window.Tone) return; A.ready=true;\n  const rev=new Tone.Reverb({decay:2,wet:.2}).toDestination();\n  A.mel=new Tone.PolySynth(Tone.Synth,{oscillator:{type:'triangle'},envelope:{attack:.01,decay:.25,sustain:.1,release:.4}}).connect(rev); A.mel.volume.value=-18;\n  A.bgmDrum=new Tone.MembraneSynth({pitchDecay:.05,octaves:3}).toDestination(); A.bgmDrum.volume.value=-14;\n  A.drum=new Tone.MembraneSynth({pitchDecay:.05,octaves:3}).toDestination(); A.drum.volume.value=-6;\n  A.tap=new Tone.PolySynth(Tone.Synth,{oscillator:{type:'square'},envelope:{attack:.001,decay:.07,sustain:0,release:.05}}).connect(rev); A.tap.volume.value=-24;\n  A.bell=new Tone.PolySynth(Tone.FMSynth).connect(rev); A.bell.volume.value=-16;\n  const sc=['D4','E4','G4','A4','B4','D5','E5']; let step=0;\n  new Tone.Loop(t=>{\n    if(step%4===0) A.bgmDrum.triggerAttackRelease('C2','8n',t);\n    else if(step%4===2&&Math.random()<.5) A.bgmDrum.triggerAttackRelease('G1','16n',t,.6);\n    if(Math.random()<.6) A.mel.triggerAttackRelease(sc[Math.floor(Math.random()*sc.length)],'16n',t);\n    step++;\n  },'8n').start(0);\n  Tone.Transport.bpm.value=112;\n}\nfunction s(fn){ if(!sfxOn||!A.ready) return; try{fn();}catch(e){} }\nconst SFX={\n  tap:()=>s(()=>A.tap.triggerAttackRelease(['E5','G5','A5'][Math.random()*3|0],'32n')),\n  drum:()=>s(()=>A.drum.triggerAttackRelease('C2','8n')),\n  gong:()=>s(()=>A.bell.triggerAttackRelease('C4','2n')),\n  warn:()=>s(()=>{const t=Tone.now();A.drum.triggerAttackRelease('G1','16n',t);A.drum.triggerAttackRelease('G1','16n',t+.15);}),\n  edge:()=>s(()=>{const t=Tone.now();A.bell.triggerAttackRelease('A5','16n',t);A.bell.triggerAttackRelease('A5','16n',t+.12);}),\n  thud:()=>s(()=>A.drum.triggerAttackRelease('C1','4n')),\n  win:()=>s(()=>{const t=Tone.now();['C5','E5','G5','C6','E6'].forEach((n,i)=>A.bell.triggerAttackRelease(n,'8n',t+i*.13));}),\n  lose:()=>s(()=>{const t=Tone.now();['E4','D4','C4','A3'].forEach((n,i)=>A.bell.triggerAttackRelease(n,'4n',t+i*.25));})\n};\nfunction say(t){ if(!sfxOn) return; try{speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.rate=.95; u.pitch=.9; speechSynthesis.speak(u);}catch(e){} }\nfunction bgm(){ if(!A.ready) return; try{ if(bgmOn) Tone.Transport.start(); else Tone.Transport.pause(); }catch(e){} }\n$('bgmBtn').onclick=()=>{ bgmOn=!bgmOn; $('bgmBtn').textContent='\ud83c\udfb5 '+(bgmOn?'ON':'OFF'); if(A.ready) bgm(); };\n$('sfxBtn').onclick=()=>{ sfxOn=!sfxOn; $('sfxBtn').textContent='\ud83d\udd0a '+(sfxOn?'ON':'OFF'); };\n\n/* ---------- \u30b2\u30fc\u30e0 ---------- */\ndocument.querySelectorAll('#diff button').forEach(btn=>btn.onclick=()=>{\n  document.querySelectorAll('#diff button').forEach(x=>x.classList.remove('on')); btn.classList.add('on'); base=+btn.dataset.d;\n});\n$('startBtn').onclick=async()=>{\n  try{ await Tone.start(); }catch(e){}\n  initAudio(); bgm();\n  wins=[0,0]; round=1; $('ov').classList.remove('show'); startRound();\n};\nfunction dots(){ $('dots').innerHTML=[0,1].map(i=>'<span>'+(wins[0]>i?'\ud83d\udd35':'\u26aa')+'<\/span>').join('')+' vs '+[0,1].map(i=>'<span>'+(wins[1]>i?'\ud83d\udd34':'\u26aa')+'<\/span>').join(''); }\nfunction show(t,ms){ msg.textContent=t; if(ms) setTimeout(()=>{ if(msg.textContent===t) msg.textContent=''; },ms); }\nfunction startRound(){\n  b=0; outSide=0; edge=0; surge=0; surgeCd=3+Math.random()*3; state='ready';\n  $('roundLabel').textContent=round+'\u756a\u76ee'; dots(); draw();\n  show('\u306f\u3063\u3051\u3088\u30fc\u3044\u2026'); say('\u306f\u3063\u3051\u3088\u30fc\u3044'); SFX.gong();\n  setTimeout(()=>{ state='fight'; show('\u306e\u3053\u3063\u305f\uff01',800); say('\u306e\u3053\u3063\u305f'); SFX.drum(); },1900);\n}\nfunction push(){\n  if(state!=='fight') return;\n  b=Math.min(100,b+6); SFX.tap(); draw();\n  P.classList.remove('bump'); void P.offsetWidth; P.classList.add('bump');\n  if(b>=100) endRound(1);\n}\n$('push').addEventListener('pointerdown',e=>{e.preventDefault(); push();});\naddEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(!e.repeat) push();} });\n\nconst dt=.05;\nsetInterval(()=>{\n  if(state!=='fight') return;\n  let f=base*(1+.12*(round-1))*(.7+Math.random()*.6);\n  if(surge>0){ surge-=dt; f*=1.9; if(surge<=0) surgeEl.style.display='none'; }\n  else { surgeCd-=dt; if(surgeCd<=0){ surge=.8; surgeCd=3+Math.random()*3; surgeEl.style.display='block'; SFX.warn(); } }\n  b=Math.max(-100,b-f*dt);\n  const e=b>=80?1:b<=-80?-1:0;\n  if(e!==0&&edge!==e){ edge=e; show('\u571f\u4ff5\u969b\uff01',900); SFX.edge(); }\n  if(Math.abs(b)<60) edge=0;\n  draw();\n  if(b<=-100) endRound(-1);\n},50);\n\nfunction draw(){\n  const c=50+b*.36;\n  P.style.left='calc('+c+'% - 84px)'; C.style.left='calc('+c+'% - 8px)';\n  let tp='rotate('+(4+.10*b)+'deg)', tc='scaleX(-1) rotate('+(4-.10*b)+'deg)';\n  if(outSide===-1) tp='translate(-40px,30px) rotate(-75deg)';\n  if(outSide===1) tc='scaleX(-1) translate(-40px,30px) rotate(-75deg)';\n  P.style.transform=tp; C.style.transform=tc;\n  mark.style.left=(50-b/2)+'%';\n}\nfunction endRound(side){\n  state='over'; outSide=side; surgeEl.style.display='none'; try{speechSynthesis.cancel();}catch(e){}\n  const won=side===1; wins[won?0:1]++; dots(); draw(); SFX.thud();\n  const kimari=['\u62bc\u3057\u51fa\u3057','\u5bc4\u308a\u5207\u308a','\u7a81\u304d\u51fa\u3057'][Math.random()*3|0];\n  setTimeout(()=>{\n    if(won){ SFX.win(); show(kimari+'\uff01\u52dd\u3061\uff01'); say(kimari+'\u3001\u3042\u306a\u305f\u306e\u52dd\u3061'); }\n    else { SFX.lose(); show(kimari+'\u2026\u8ca0\u3051'); say(kimari+'\u3001CPU\u306e\u52dd\u3061'); }\n  },500);\n  setTimeout(()=>{\n    if(wins[0]===2||wins[1]===2){ matchEnd(wins[0]===2); }\n    else { round++; startRound(); }\n  },2800);\n}\nfunction matchEnd(win){\n  $('card').innerHTML='<h2>'+(win?'\ud83c\udfc6 \u3042\u306a\u305f\u306e\u52dd\u3061\uff01':'\ud83d\ude22 CPU\u306e\u52dd\u3061\u2026')+'<\/h2><p>'+(win?'\u898b\u4e8b\u306a\u62bc\u3057\u76f8\u64b2\uff01':'\u304a\u3057\u3044\uff01\u3082\u3046\u4e00\u5ea6\u6311\u6226\u3057\u3088\u3046')+'<\/p><button class=\"btn\" onclick=\"location.reload()\">\u3082\u3046\u4e00\u5ea6\u3042\u305d\u3076<\/button>';\n  $('ov').classList.add('show'); if(win){SFX.win();}\n}\ndraw(); dots();\n<\/script>\n<\/body>\n<\/html>\n\n<\/body><\/html>"};
const f=document.getElementById('f'),back=document.getElementById('back');
