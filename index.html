<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QOLゲームズ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#fff6e4; --bg2:#ffe8d6; --bg3:#ffd9e8;
    --ink:#4a3f35; --paper:#ffffff; --shadow:#00000018;
    --nakama:#7fa88f; --nakama-d:#5c8a71;
    --quiz:#f0c25b; --quiz-d:#cf9f2e;
    --sumo:#c2413a; --sumo-d:#962f29;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html,body{height:100%;}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; color:var(--ink); font-family:'Zen Maru Gothic', sans-serif;
    background:
      radial-gradient(circle at 15% 10%, #ffffffaa, transparent 40%),
      radial-gradient(circle at 85% 85%, #ffffff88, transparent 45%),
      linear-gradient(145deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    min-height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding:36px 18px 44px; gap:30px;
    touch-action:manipulation; -webkit-user-select:none; user-select:none;
    overflow-x:hidden; position:relative;
  }

  /* ふわふわ浮かぶ飾り */
  .deco{position:absolute; font-size:2.2rem; opacity:.5; pointer-events:none; animation:float 6s ease-in-out infinite;}
  .deco1{top:8%; left:6%; animation-delay:0s;}
  .deco2{top:14%; right:8%; animation-delay:1.2s; font-size:1.8rem;}
  .deco3{bottom:10%; left:10%; animation-delay:2.1s; font-size:1.6rem;}
  .deco4{bottom:16%; right:7%; animation-delay:.6s; font-size:2rem;}
  @keyframes float{
    0%,100%{ transform:translateY(0) rotate(-4deg); }
    50%{ transform:translateY(-14px) rotate(4deg); }
  }

  .title-wrap{text-align:center; position:relative; z-index:1;}
  h1{
    font-size:2rem; margin:0; color:var(--sumo-d);
    letter-spacing:.06em; line-height:1.4;
    text-shadow:2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
  }
  .wobble{display:inline-block; animation:wobble 2.4s ease-in-out infinite;}
  @keyframes wobble{
    0%,100%{ transform:rotate(0deg); }
    25%{ transform:rotate(-8deg); }
    75%{ transform:rotate(8deg); }
  }
  .subtitle{
    display:inline-block; margin-top:10px; font-size:1rem; color:#5a4632; font-weight:700;
    background:#ffffffcc; padding:6px 18px; border-radius:20px;
    box-shadow:0 2px 0 #00000012;
  }

  .menu{
    display:flex; flex-direction:column; gap:20px;
    width:100%; max-width:420px; position:relative; z-index:1;
  }

  .game-card{
    display:flex; align-items:center; gap:16px;
    padding:20px 22px; background:var(--paper);
    border-radius:26px; text-decoration:none; color:var(--ink);
    box-shadow:0 7px 0 var(--card-shadow, #ddd), 0 10px 18px var(--shadow);
    font-weight:900; font-size:1.25rem;
    border:3px solid var(--card-border, #eee);
    transition:transform .12s ease, box-shadow .12s ease;
    position:relative; overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .game-card:active{
    transform:translateY(6px);
    box-shadow:0 1px 0 var(--card-shadow, #ddd), 0 3px 6px var(--shadow);
  }
  .card-nakama{ --card-border:var(--nakama); --card-shadow:var(--nakama-d); }
  .card-quiz{ --card-border:var(--quiz); --card-shadow:var(--quiz-d); }
  .card-sumo{ --card-border:var(--sumo); --card-shadow:var(--sumo-d); }

  .icon-badge{
    flex:0 0 auto; width:62px; height:62px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:2rem; color:#fff;
    box-shadow:inset 0 -4px 0 #00000022;
  }
  .card-nakama .icon-badge{ background:linear-gradient(160deg, #94c2a9, var(--nakama)); }
  .card-quiz .icon-badge{ background:linear-gradient(160deg, #f8d685, var(--quiz)); }
  .card-sumo .icon-badge{ background:linear-gradient(160deg, #e0695f, var(--sumo)); }

  .card-text{display:flex; flex-direction:column; gap:2px; flex:1;}
  .card-text .label{font-size:1.2rem;}
  .card-text .hint{font-size:.82rem; font-weight:700; color:#9a8f80;}

  .arrow{font-size:1.6rem; color:var(--card-border, #ccc); flex:0 0 auto;}

  .sparkle{
    position:absolute; top:-6px; right:10px; font-size:1.1rem;
    animation:sparkle 1.8s ease-in-out infinite;
  }
  .card-quiz .sparkle{animation-delay:.4s;}
  .card-sumo .sparkle{animation-delay:.9s;}
  @keyframes sparkle{
    0%,100%{ opacity:.3; transform:scale(.8) rotate(0deg); }
    50%{ opacity:1; transform:scale(1.2) rotate(20deg); }
  }

  .footer-note{
    margin-top:6px; font-size:.85rem; color:#5a4632; text-align:center;
    max-width:320px; line-height:1.6; position:relative; z-index:1;
    background:#ffffffcc; padding:8px 16px; border-radius:16px;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg1:#2a2318; --bg2:#30241f; --bg3:#2c1f28; --ink:#f3ead8; --paper:#3a3226; --shadow:#00000055;
    }
    :root:not([data-theme="light"]) .subtitle,
    :root:not([data-theme="light"]) .footer-note{
      color:#f3ead8; background:#00000055;
    }
  }
</style>
</head>
<body>

<span class="deco deco1">🎈</span>
<span class="deco deco2">⭐</span>
<span class="deco deco3">🌸</span>
<span class="deco deco4">🎊</span>

<div class="title-wrap">
  <h1><span class="wobble">🎮</span> QOLゲームズ</h1>
  <div class="subtitle">すきなゲームを えらんでね</div>
</div>

<div class="menu">
  <a href="https://claude.ai/artifact/1kjY48hLSJMb6znrtCztnP" class="game-card card-nakama">
    <div class="icon-badge">🧩</div>
    <div class="card-text">
      <span class="label">なかまさがし</span>
      <span class="hint">同じ絵をみつけよう</span>
    </div>
    <span class="arrow">▶</span>
    <span class="sparkle">✨</span>
  </a>

  <a href="https://claude.ai/artifact/UDLR7ECZvr9GAV8PAh1ffL" class="game-card card-quiz">
    <div class="icon-badge">🎤</div>
    <div class="card-text">
      <span class="label">思い出クイズ</span>
      <span class="hint">なつかしい問題に挑戦</span>
    </div>
    <span class="arrow">▶</span>
    <span class="sparkle">✨</span>
  </a>

  <a href="https://claude.ai/artifact/FR8t8Gnv3Gvb2Wzsv8hRJg" class="game-card card-sumo">
    <div class="icon-badge">🤼</div>
    <div class="card-text">
      <span class="label">ミニ相撲</span>
      <span class="hint">連打で押し出せ！</span>
    </div>
    <span class="arrow">▶</span>
    <span class="sparkle">✨</span>
  </a>
</div>

<div class="footer-note">タップすると、それぞれのゲームが開きます</div>

</body>
</html>

</body></html>
